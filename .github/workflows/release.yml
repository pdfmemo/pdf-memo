# PDF 메모 릴리스 만들기
#
# upload/v<판> 가지(예: upload/v0.5.0)를 올리면 그 가지의 files/ 폴더로 릴리스 v<판>을 만든다.
#   files/notes.md  릴리스 설명
#   files/PDF-Memo-Windows-Setup.exe, files/PDF-Memo-Windows.zip, files/PDF-Memo-Mac.dmg  받을 파일(있는 것만)
# upload 가지는 main에서 갈라야 한다(이 파일이 그 커밋에 있어야 돈다).
# 같은 판 릴리스가 이미 있으면 파일만 바꿔 끼우고 설명을 고친다(맥 dmg를 나중에 더할 때).
# 끝나면 upload 가지를 지워서 받을 파일이 저장소 가지에 남지 않게 한다.
name: release

on:
  push:
    branches: ['upload/v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TARGET: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="${BRANCH#upload/}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::가지 이름은 upload/v0.0.0 꼴이어야 함: $BRANCH"; exit 1
          fi
          cd files
          if [ ! -s notes.md ]; then echo "::error::files/notes.md 없음"; exit 1; fi
          extra=$(ls -1A | grep -v -x -e notes.md -e PDF-Memo-Windows-Setup.exe -e PDF-Memo-Windows.zip -e PDF-Memo-Mac.dmg || true)
          if [ -n "$extra" ]; then echo "::error::모르는 파일: $extra"; exit 1; fi
          assets=()
          for f in PDF-Memo-Windows-Setup.exe PDF-Memo-Windows.zip PDF-Memo-Mac.dmg; do
            if [ -f "$f" ]; then assets+=("$f"); fi
          done
          if [ ${#assets[@]} -eq 0 ]; then echo "::error::받을 파일이 없음"; exit 1; fi
          ls -l "${assets[@]}"
          sha256sum "${assets[@]}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "${assets[@]}" --target "$TARGET" --title "PDF 메모 ${tag#v}" --notes-file notes.md
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size)")'

      - name: upload 가지 지우기
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
